services:
  # Web Service
  - type: web
    name: jump-email-app
    env: elixir
    region: oregon
    plan: free
    buildCommand: |
      echo "Node version:" && node --version
      echo "NPM version:" && npm --version
      mix deps.get --only prod
      MIX_ENV=prod mix compile
      echo "Installing npm packages..."
      cd assets
      rm -rf node_modules package-lock.json
      npm install
      ls -la node_modules | grep topbar
      cd ..
      echo "Running assets deploy..."
      MIX_ENV=prod mix assets.deploy
      MIX_ENV=prod mix release
    startCommand: _build/prod/rel/jump/bin/jump eval "Jump.Release.migrate()" && _build/prod/rel/jump/bin/jump start
    healthCheckPath: /
    envVars:
      - key: MIX_ENV
        value: prod
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PHX_HOST
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOAK_KEY
        generateValue: true
      - key: POOL_SIZE
        value: 10
